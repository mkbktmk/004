<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 劳动法智能问答助手</title>
<style>
  * { box-sizing:border-box; }
  ::selection { background:rgba(166,58,44,.18); }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
         background:#f6f4ed; color:#1e1a14; -webkit-font-smoothing:antialiased; }
  .card { width:360px; padding:40px 36px 28px; background:#fdfcf7; border:1px solid #d9d2bd;
          border-radius:2px; text-align:center; }
  .card::before { content:"法"; display:flex; align-items:center; justify-content:center;
                  width:46px; height:46px; margin:0 auto 18px; background:#a63a2c; color:#fdfcf7;
                  font-family:"Songti SC","STSong","SimSun",serif; font-size:24px; font-weight:600;
                  border-radius:3px; box-shadow:inset 0 0 0 2px rgba(253,252,247,.35); }
  h1 { font-family:"Songti SC","STSong","SimSun",serif; font-size:22px; font-weight:600;
       margin:0 0 8px; letter-spacing:.24em; text-indent:.24em; }
  .hint { font-size:12px; color:#7e7767; margin:0 0 24px; line-height:1.7; letter-spacing:.06em; }
  label { display:block; text-align:left; font-size:12px; letter-spacing:.12em;
          color:#7e7767; margin:16px 0 7px; }
  input { width:100%; box-sizing:border-box; padding:10px 12px; font-size:14px; color:#1e1a14;
          border:1px solid #d9d2bd; border-radius:2px; background:#fff;
          transition:border-color .15s, box-shadow .15s; }
  input:focus { outline:none; border-color:#a63a2c; box-shadow:0 0 0 3px rgba(166,58,44,.10); }
  button { width:100%; padding:11px; font-size:14px; border-radius:2px; cursor:pointer; margin-top:20px;
           letter-spacing:.3em; text-indent:.3em;
           font-family:"Songti SC","STSong","SimSun",serif;
           transition:background .15s, border-color .15s, color .15s; }
  #submit { border:1px solid #1e1a14; background:#1e1a14; color:#f5f1e4; }
  #submit:hover:not(:disabled) { background:#a63a2c; border-color:#a63a2c; }
  #submit:disabled { background:#b9b09c; border-color:#b9b09c; }
  .ghost { border:1px solid #d9d2bd; background:transparent; color:#7e7767; margin-top:10px;
           font-size:12px; letter-spacing:.1em; text-indent:.1em;
           font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
  .ghost:hover { border-color:#a63a2c; color:#a63a2c; }
  .msg { min-height:18px; margin-top:14px; font-size:13px; line-height:1.5; text-align:left; }
  .msg.err { color:#a63a2c; }
  .msg.ok { color:#4d6b2f; }
  .foot { margin-top:22px; padding-top:16px; border-top:1px solid #e5e0cf; font-size:11.5px;
          color:#aaa18f; line-height:1.7; }
</style>
</head>
<body>
<div class="card">
  <h1 id="title">登录</h1>
  <p class="hint">劳动法智能问答助手 · 依据本地法规库作答并标注出处</p>
  <form id="form">
    <label for="username">用户名</label>
    <input id="username" name="username" autocomplete="username" minlength="2" maxlength="32" required>
    <label for="password">密码</label>
    <input id="password" name="password" type="password" autocomplete="current-password" minlength="6" maxlength="64" required>
    <button id="submit" type="submit">登录</button>
    <button id="switch" class="ghost" type="button">没有账号？注册</button>
  </form>
  <div id="msg" class="msg"></div>
  <p class="foot">普通用户可直接注册；管理员账号由服务端初始化生成。</p>
</div>
<script>
const form = document.getElementById('form');
const msg = document.getElementById('msg');
const title = document.getElementById('title');
const submit = document.getElementById('submit');
const switchBtn = document.getElementById('switch');
let mode = 'login';

function show(text, kind) {
  msg.className = 'msg ' + (kind || '');
  msg.textContent = text || '';
}

async function post(url, body) {
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || '请求失败');
  return data;
}

switchBtn.addEventListener('click', () => {
  mode = mode === 'login' ? 'register' : 'login';
  const isLogin = mode === 'login';
  title.textContent = isLogin ? '登录' : '注册';
  submit.textContent = isLogin ? '登录' : '注册并登录';
  switchBtn.textContent = isLogin ? '没有账号？注册' : '已有账号？去登录';
  show('');
});

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  submit.disabled = true;
  try {
    if (mode === 'register') {
      await post('/api/auth/register', { username, password });
      show('注册成功，正在登录…', 'ok');
    }
    await post('/api/auth/login', { username, password });
    location.href = '/chat';
  } catch (err) {
    show(err.message, 'err');
    submit.disabled = false;
  }
});

fetch('/api/auth/me').then(r => { if (r.ok) location.href = '/chat'; }).catch(() => {});
</script>
</body>
</html>
