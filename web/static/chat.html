<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>劳动法智能问答助手</title>
<style>
  * { box-sizing:border-box; }
  :root {
    --paper:#f6f4ed; --card:#fdfcf7;
    --ink:#1e1a14; --body:#3a352b; --sub:#7e7767; --faint:#aaa18f;
    --line:#e5e0cf; --line2:#d9d2bd;
    --seal:#a63a2c;
    --serif:"Songti SC","STSong","Noto Serif CJK SC","Noto Serif SC","SimSun",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
    --num:ui-monospace,"SF Mono",Consolas,monospace;
  }
  ::selection { background:rgba(166,58,44,.18); }
  body { margin:0; height:100vh; overflow:hidden; color:var(--ink); background:var(--paper);
         font-family:var(--sans);
         -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
  .app { display:flex; height:100vh; }

  /* ── 侧栏：墨色，像法典封面 ── */
  aside { width:264px; flex:0 0 264px; background:#211d17;
          display:flex; flex-direction:column; }
  aside header { padding:24px 20px 6px; font-family:var(--serif); font-size:19px; font-weight:600;
                 color:#f2ecdd; letter-spacing:.14em; }
  aside header::after { content:"法规检索 · 逐条标注出处"; display:block; margin-top:7px;
                        font-size:10.5px; font-weight:400; color:#8d8471; letter-spacing:.22em; }
  #new { margin:18px 16px 14px; padding:9px; font-size:12.5px; letter-spacing:.12em;
         color:#e6dfcd; background:transparent; border:1px solid #4d463a; border-radius:2px;
         cursor:pointer; transition:border-color .15s, color .15s, background .15s; }
  #new:hover { border-color:var(--seal); color:#fff; background:rgba(166,58,44,.14); }
  #sessions { flex:1; overflow-y:auto; margin:0; padding:0 10px 10px; list-style:none; }
  #sessions::-webkit-scrollbar { width:9px; }
  #sessions::-webkit-scrollbar-thumb { background:#3d372c; border-radius:6px; border:2px solid #211d17; }
  #sessions li { position:relative; display:flex; align-items:center; gap:6px;
                 padding:9px 10px 9px 14px; margin-bottom:2px; font-size:12.5px;
                 color:#b0a793; border-radius:2px; cursor:pointer; transition:background .12s, color .12s; }
  #sessions li::before { content:""; position:absolute; left:4px; top:50%; transform:translateY(-50%);
                         width:2px; height:0; background:var(--seal);
                         transition:height .18s cubic-bezier(.2,.8,.2,1); }
  #sessions li:hover { background:#2b261e; color:#d9d2bf; }
  #sessions li.active { background:rgba(166,58,44,.15); color:#f2ecdd; }
  #sessions li.active::before { height:16px; }
  #sessions .name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #sessions .del { border:0; background:transparent; color:#6b6353; cursor:pointer; font-size:11px;
                   opacity:0; transition:opacity .12s, color .12s; }
  #sessions li:hover .del { opacity:1; }
  #sessions .del:hover { color:#e0786a; }
  aside footer { border-top:1px solid #373126; padding:12px 18px; font-size:11.5px;
                 color:#8d8471; display:flex; align-items:center; justify-content:space-between; }
  aside footer a, #logout { border:0; background:transparent; color:#cf9c85;
                            font-size:11.5px; cursor:pointer; text-decoration:none; }
  aside footer a:hover, #logout:hover { color:#eac0ae; }

  /* ── 正文区：纸面，答案即文书 ── */
  main { flex:1; display:flex; flex-direction:column; min-width:0; }
  #messages { flex:1; overflow-y:auto; padding:40px 32px 24px; scroll-behavior:smooth; }
  #messages::-webkit-scrollbar { width:11px; }
  #messages::-webkit-scrollbar-thumb { background:#d5cfbc; border-radius:8px; border:3px solid var(--paper); }
  #messages::-webkit-scrollbar-thumb:hover { background:#bdb5a0; }

  .bubble { max-width:720px; margin:0 auto 8px; }
  .bubble + .bubble { margin-top:26px; }
  .bubble.user { display:flex; justify-content:flex-end; margin-top:34px; }
  .bubble.user .text { padding:10px 16px; border-radius:2px; background:var(--ink); color:#f5f1e4;
                       font-size:14px; line-height:1.75; max-width:540px;
                       white-space:pre-wrap; word-break:break-word; }
  /* 助手回答用衬线：一份打印出来的意见书 */
  .bubble.assistant .text { font-family:var(--serif); font-size:15px; line-height:1.95;
                            color:var(--body); word-break:break-word; white-space:pre-wrap; }

  /* ── 答案结构块：意见书式分节 ── */
  .blk { margin-top:24px; }
  .blk h4 { font-family:var(--serif); font-size:12px; font-weight:600; letter-spacing:.34em;
            color:var(--seal); margin:0 0 9px; }
  .blk h4::after { content:""; display:block; width:26px; height:1px;
                   background:var(--line2); margin-top:7px; }
  .blk p { margin:0; }
  .blk ul { margin:0; padding-left:1.1em; }
  .blk li { margin-bottom:10px; line-height:1.9; }
  .blk li::marker { color:var(--faint); }
  .blk li:last-child { margin-bottom:0; }
  .blk.concl { margin-top:0; padding:18px 22px; background:var(--card);
               border:1px solid var(--line2); border-left:3px solid var(--seal); }
  .blk.concl h4::after { background:var(--seal); }
  .blk.concl p { font-size:16.5px; font-weight:600; color:var(--ink); line-height:1.9; }
  /* 条号出处：朱砂小字，印章色即权威 */
  .src { font-family:var(--serif); font-size:12.5px; color:var(--seal); opacity:.82; }
  .blk strong { font-weight:700; color:var(--ink); }

  details { max-width:720px; margin:18px auto 34px; font-family:var(--serif); font-size:13px;
            color:var(--sub); border-top:1px solid var(--line); padding-top:13px; }
  details summary { cursor:pointer; color:var(--seal); user-select:none; font-size:13px;
                    letter-spacing:.08em; transition:opacity .12s; }
  details summary:hover { opacity:.72; }
  details ul { margin:12px 0 0; padding:0; list-style:none; }
  details li { margin-bottom:12px; padding:10px 14px; background:var(--card);
               border:1px solid var(--line); border-left:2px solid var(--line2); line-height:1.8; }
  details li strong { font-size:13.5px; color:var(--ink); letter-spacing:.02em; }
  details li p { margin:4px 0 0; color:var(--body); font-size:13px; line-height:1.85; }
  details em { font-style:normal; color:var(--faint); font-size:11.5px; font-family:var(--num); }

  .meta { max-width:720px; margin:0 auto 28px; font-size:11px; color:#bdb4a0;
          font-family:var(--num); letter-spacing:.02em; }
  .empty { color:var(--faint); font-family:var(--serif); font-size:15px; text-align:center;
           margin-top:24vh; line-height:2.2; letter-spacing:.06em; }

  /* ── 输入区：悬浮圆角输入卡 ── */
  form { padding:6px 32px 18px; }
  .box { max-width:720px; margin:0 auto; background:#fff; border:1px solid var(--line2);
         border-radius:22px; padding:13px 16px 9px; box-shadow:0 2px 14px rgba(30,26,20,.06);
         transition:border-color .15s, box-shadow .15s; }
  .box:focus-within { border-color:#c6bda5; box-shadow:0 4px 20px rgba(30,26,20,.09); }
  textarea { width:100%; display:block; resize:none; padding:2px 2px 0; font-size:14.5px;
             line-height:1.7; font-family:var(--sans); color:var(--ink);
             background:transparent; border:0; }
  textarea:focus { outline:none; }
  textarea::placeholder { color:#bdb4a0; }
  .bar { display:flex; align-items:center; justify-content:space-between; margin-top:8px; }
  .kbd-hint { font-size:11px; color:#c8c0ac; letter-spacing:.04em; user-select:none; }
  #send { width:34px; height:34px; padding:0; display:flex; align-items:center; justify-content:center;
          font-size:17px; line-height:1; font-family:var(--sans); border:0; border-radius:50%;
          background:var(--ink); color:#f5f1e4; cursor:pointer;
          transition:background .15s, transform .12s; }
  #send:hover:not(:disabled) { background:var(--seal); transform:translateY(-1px); }
  #send:disabled { background:#e2dcc9; color:#fff; cursor:not-allowed; }
  .fineprint { max-width:720px; margin:9px auto 0; text-align:center; font-size:11px;
               color:#c0b8a4; letter-spacing:.04em; }

  @media (max-width:820px) {
    aside { display:none; }
    #messages { padding:24px 18px 14px; }
    form { padding:4px 16px 12px; }
    .blk.concl { padding:14px 16px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <header>劳动法问答</header>
    <button id="new">＋ 新对话</button>
    <ul id="sessions"></ul>
    <footer>
      <span id="who">…</span>
      <span>
        <a id="adminLink" href="/admin" style="display:none;color:#2563eb;text-decoration:none;margin-right:12px;">知识库</a>
        <button id="logout">退出</button>
      </span>
    </footer>
  </aside>
  <main>
    <div id="messages"><div class="empty">输入你的劳动法问题，<br>系统会检索条文并标注出处。</div></div>
    <form id="composer">
      <div class="box">
        <textarea id="q" rows="2" placeholder="描述你的劳动法问题，例如：月薪6000元，工作日加班10小时，加班费多少？"></textarea>
        <div class="bar">
          <span class="kbd-hint">Enter 发送 · Shift + Enter 换行</span>
          <button id="send" type="submit" aria-label="发送">↑</button>
        </div>
      </div>
      <p class="fineprint">内容由 AI 生成，结论与金额请以法条原文和专业意见为准</p>
    </form>
  </main>
</div>
<script>
const $ = (id) => document.getElementById(id);
const messages = $('messages');
const list = $('sessions');
let sessionId = '';
let currentUser = null;

async function api(url, options) {
  const res = await fetch(url, options);
  if (res.status === 401) { location.href = '/'; throw new Error('未登录'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || '请求失败');
  return data;
}

function createBubble(role) {
  const bubble = document.createElement('div');
  bubble.className = 'bubble ' + role;
  const body = document.createElement('div');
  body.className = 'text';
  bubble.appendChild(body);
  const holder = messages.querySelector('.empty');
  if (holder) holder.remove();
  messages.appendChild(bubble);
  messages.scrollTop = messages.scrollHeight;
  return { bubble: bubble, body: body };
}

function appendSources(bubble, sources) {
  if (!sources || !sources.length) return;
  const box = document.createElement('details');
  const sum = document.createElement('summary');
  sum.textContent = '引用条文（' + sources.length + '）';
  box.appendChild(sum);
  const ul = document.createElement('ul');
  sources.forEach((s) => {
    const li = document.createElement('li');
    const head = document.createElement('strong');
    head.textContent = s.law + ' ' + s.article_no;
    li.appendChild(head);
    if (s.via) {
      const via = document.createElement('em');
      via.textContent = ' · ' + s.via;
      li.appendChild(via);
    }
    const p = document.createElement('p');
    p.textContent = s.text || '';
    li.appendChild(p);
    ul.appendChild(li);
  });
  box.appendChild(ul);
  bubble.appendChild(box);
}

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g,
  (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// 出处标注弱化成等宽小字：可查但不抢戏
function inline(s) {
  return esc(s).replace(/[（(]?《[^》]+》第[一二三四五六七八九十百零]+条[）)]?/g,
    (m) => '<span class="src">' + m + '</span>');
}

function renderBody(body) {
  const lines = body.split('\n').map((l) => l.trim()).filter(Boolean);
  const bullets = lines.filter((l) => /^[-•*]\s/.test(l));
  if (bullets.length && bullets.length >= lines.length - 1) {
    return '<ul>' + bullets.map((l) => '<li>' + inline(l.replace(/^[-•*]\s*/, '')) + '</li>').join('') + '</ul>';
  }
  return '<p>' + inline(body).replace(/\n/g, '<br>') + '</p>';
}

// 把 【结论】【依据】【计算过程】【提示】 渲染成有层次的块
function formatAnswer(text) {
  const parts = String(text || '').split(/【(结论|依据|计算过程|提示)】/);
  if (parts.length < 3) return '<p>' + inline(text) + '</p>';
  let html = '';
  for (let i = 1; i < parts.length; i += 2) {
    const title = parts[i];
    const body = (parts[i + 1] || '').trim();
    if (!body) continue;
    html += '<section class="blk' + (title === '结论' ? ' concl' : '') + '">' +
      '<h4>' + esc(title) + '</h4>' + renderBody(body) + '</section>';
  }
  return html || '<p>' + inline(text) + '</p>';
}

function addMessage(role, text, sources) {
  const made = createBubble(role);
  if (role === 'assistant') {
    made.body.style.whiteSpace = 'normal';
    made.body.innerHTML = formatAnswer(text);
  } else {
    made.body.textContent = text;
  }
  appendSources(made.bubble, sources);
}

function clearMessages() {
  messages.innerHTML = '';
}

function renderSessions(items) {
  list.innerHTML = '';
  items.forEach((item) => {
    const li = document.createElement('li');
    li.className = item.id === sessionId ? 'active' : '';
    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = item.title;
    const del = document.createElement('button');
    del.className = 'del';
    del.textContent = '删除';
    del.addEventListener('click', async (event) => {
      event.stopPropagation();
      await api('/api/sessions/' + item.id, { method: 'DELETE' });
      if (item.id === sessionId) { sessionId = ''; clearMessages(); }
      loadSessions();
    });
    li.appendChild(name);
    li.appendChild(del);
    li.addEventListener('click', () => openSession(item.id));
    list.appendChild(li);
  });
}

async function loadSessions() {
  const data = await api('/api/sessions');
  renderSessions(data.sessions);
}

async function openSession(id) {
  const data = await api('/api/sessions/' + id);
  sessionId = id;
  clearMessages();
  data.messages.forEach((m) => addMessage(m.role, m.content, m.sources));
  loadSessions();
}

async function send(question) {
  const button = $('send');
  button.disabled = true;
  addMessage('user', question);
  const made = createBubble('assistant');
  made.body.textContent = '检索法条…';
  let answer = '';
  let sources = [];
  let gotMeta = false;

  const handle = (raw) => {
    const lines = raw.split('\n');
    let kind = 'message';
    let data = '';
    lines.forEach((line) => {
      if (line.indexOf('event:') === 0) kind = line.slice(6).trim();
      else if (line.indexOf('data:') === 0) data += line.slice(5).trim();
    });
    if (!data) return;
    const payload = JSON.parse(data);
    if (kind === 'meta') {
      sessionId = payload.session_id;
      sources = payload.sources || [];
      gotMeta = true;
      made.body.textContent = '';
    } else if (kind === 'delta') {
      answer += payload.text;
      made.body.textContent = answer;
      messages.scrollTop = messages.scrollHeight;
    } else if (kind === 'done') {
      // 流式期间是纯文本（靠 pre-wrap 保留换行），收尾换成结构块后要恢复普通换行
      made.body.style.whiteSpace = 'normal';
      made.body.innerHTML = formatAnswer(answer);
      appendSources(made.bubble, sources);
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = '耗时 ' + payload.elapsed + 's · ' + (payload.model || '-');
      messages.appendChild(meta);
      messages.scrollTop = messages.scrollHeight;
      loadSessions();
    } else if (kind === 'error') {
      made.body.textContent = answer + '\n\n[生成中断] ' + payload.detail;
    }
  };

  try {
    const res = await fetch('/api/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: question, session_id: sessionId })
    });
    if (res.status === 401) { location.href = '/'; return; }
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || '请求失败');
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    while (true) {
      const step = await reader.read();
      if (step.done) break;
      buffer += decoder.decode(step.value, { stream: true });
      let cut;
      while ((cut = buffer.indexOf('\n\n')) >= 0) {
        handle(buffer.slice(0, cut));
        buffer = buffer.slice(cut + 2);
      }
    }
    if (buffer.trim()) handle(buffer);
    if (!gotMeta && !answer) made.body.textContent = '未收到回答，请重试';
    if (answer === '' && gotMeta) made.body.textContent = '（模型未返回内容）';
  } catch (err) {
    made.body.textContent = answer ? answer + '\n\n[中断] ' + err.message : '出错了：' + err.message;
  } finally {
    button.disabled = false;
  }
}

$('new').addEventListener('click', () => {
  sessionId = '';
  clearMessages();
  messages.innerHTML = '<div class="empty">新对话已开始，输入你的问题。</div>';
  loadSessions();
});

$('composer').addEventListener('submit', (event) => {
  event.preventDefault();
  const box = $('q');
  const question = box.value.trim();
  if (!question) return;
  box.value = '';
  send(question);
});

$('q').addEventListener('keydown', (event) => {
  if (event.key === 'Enter' && !event.shiftKey) {
    event.preventDefault();
    $('composer').requestSubmit();
  }
});

$('logout').addEventListener('click', async () => {
  await fetch('/api/auth/logout', { method: 'POST' });
  location.href = '/';
});

(async () => {
  try {
    currentUser = await api('/api/auth/me');
    $('who').textContent = currentUser.username + (currentUser.role === 'admin' ? ' · 管理员' : '');
    if (currentUser.role === 'admin') $('adminLink').style.display = 'inline';
    await loadSessions();
  } catch (err) { /* 未登录会跳转 */ }
})();
</script>
</body>
</html>
